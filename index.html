<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202020;background:#fff;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #707070;outline-offset:4px}header{height:72px;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px;font-weight:600;letter-spacing:-.5px}#reset{background:none;border:1px solid #e7e7e7;border-radius:10px;padding:7px 12px;color:#555;font-size:13px;display:flex;align-items:center;gap:8px}#reset:hover,.example:hover{background:#f5f5f5}main{height:calc(100dvh - 72px);display:flex;flex-direction:column;max-width:800px;margin:auto;padding:0 24px}#welcome{text-align:center;margin-top:auto;padding-top:30px}h1{font-size:32px;line-height:1.3;font-weight:600;letter-spacing:-1px;margin:0 0 12px}#welcome p{color:#777;font-size:15px;margin:0}.examples{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px 0 30px}.example{background:#fff;border:1px solid #e5e5e5;color:#555;border-radius:24px;padding:9px 15px;font-size:13px}#messages{display:none;overflow-y:auto;flex:1;padding:24px 4px;scroll-behavior:smooth}.started #messages{display:flex;flex-direction:column;gap:28px}.started #welcome{display:none}.message{white-space:pre-wrap;overflow-wrap:anywhere;flex-shrink:0}.user{align-self:flex-end;max-width:85%;padding:10px 18px;border-radius:24px;background:#f1f1f1}.assistant{align-self:stretch;padding:0 8px}.error{color:#a43829;background:#fff5f3;border-radius:12px;padding:12px 16px}#status{font-size:14px;color:#777;min-height:26px;padding:0 12px}#status:empty{min-height:0}.composer{margin-bottom:auto;padding-top:8px}.started .composer{margin-bottom:0}form{background:#f4f4f4;border:1px solid #eaeaea;border-radius:28px;padding:13px 14px 12px 20px;display:flex;gap:12px;align-items:flex-end;box-shadow:0 3px 10px #00000004}form:focus-within{border-color:#c6c6c6}textarea{background:transparent;border:0;outline:none;resize:none;flex:1;width:100%;min-width:0;min-height:32px;max-height:160px;padding:4px 0;color:#202020;line-height:24px}textarea::placeholder{color:#858585}#send{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border:0;border-radius:50%;background:#202020;color:#fff}#send:disabled{background:#d6d6d6;color:#fff;cursor:default}#send:not(:disabled):hover{background:#444}footer{text-align:center;font-size:11px;color:#929292;padding:12px 4px 18px}button:disabled{cursor:default}#reset:disabled{opacity:.4}.started #messages:empty{display:none}@media(max-width:560px){header{padding:12px 18px;height:64px}main{height:calc(100dvh - 64px);padding:0 16px}h1{font-size:27px}.examples{gap:7px}.example{font-size:12px;padding:8px 12px}.user{max-width:92%}footer{font-size:10px}}
</style>
</head>
<body>
<header><strong>HR Agent</strong><button id="reset" type="button" aria-label="New chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M16 3l5 5M10 14l1-5 8-8 5 5-8 8z"/></svg>New chat</button></header>
<main>
<div id="welcome"><h1>What can I help you find?</h1><p>Ask about your team’s departments and roles.</p><div class="examples"><button class="example" type="button">What is Ahmed's department?</button><button class="example" type="button">What is Sara's role?</button><button class="example" type="button">What is Omar's role?</button></div></div>
<div id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
<div class="composer"><div id="status" role="status"></div><form id="chat"><textarea id="input" aria-label="Your message" placeholder="Message HR Agent" rows="1" required></textarea><button id="send" type="submit" aria-label="Send message" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><footer>Fictional employee data. Each question is independent.</footer></div>
</main>
<script>
const form=document.querySelector('#chat'),input=document.querySelector('#input'),send=document.querySelector('#send'),messages=document.querySelector('#messages'),status=document.querySelector('#status'),reset=document.querySelector('#reset'),main=document.querySelector('main');
let busy=false;
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';send.disabled=busy||!input.value.trim();}
function add(text,kind){const div=document.createElement('div');div.className='message '+kind;div.setAttribute('aria-label',kind==='user'?'You':kind==='error'?'Request failed':'HR Agent');div.textContent=text;messages.append(div);messages.scrollTop=messages.scrollHeight;}
form.addEventListener('submit',async event=>{event.preventDefault();const message=input.value.trim();if(!message||busy)return;busy=true;main.classList.add('started');add(message,'user');input.value='';resize();reset.disabled=true;status.textContent='Thinking…';try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});if(!response.ok){let detail='Please try again.';if(response.status===503)detail='Configure the server’s OpenAI API key in .env.';throw new Error('Request failed ('+response.status+'). '+detail);}const data=await response.json();add(data.answer,'assistant');}catch(error){add(error.message||'Could not connect to the server. Please try again.','error');}finally{busy=false;reset.disabled=false;status.textContent='';resize();input.focus();}});
input.addEventListener('input',resize);
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}});
document.querySelectorAll('.example').forEach(button=>button.addEventListener('click',()=>{input.value=button.textContent;form.requestSubmit();}));
reset.addEventListener('click',()=>{if(busy)return;messages.replaceChildren();main.classList.remove('started');input.value='';resize();input.focus();});
</script>
</body>
</html>
